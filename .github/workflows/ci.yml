name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  cloud-mutation-guardrail:
    name: Cloud Mutation Guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Block cloud mutative patterns in backend/app
        run: |
          python scripts/cloud_mutation_guardrail.py \
            --target backend/app \
            --allowlist .security/cloud_mutation_guardrail_allowlist.txt

  security:
    name: Security Gates (SAST + SCA + Secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate security baseline
        run: python scripts/security_baseline.py validate --file .security/security_baseline.json

      - name: Resolve baseline exception IDs
        id: baseline
        run: |
          echo "bandit_ids=$(python scripts/security_baseline.py bandit-ids --file .security/security_baseline.json)" >> "$GITHUB_OUTPUT"
          echo "pip_audit_ids=$(python scripts/security_baseline.py pip-audit-ids --file .security/security_baseline.json)" >> "$GITHUB_OUTPUT"
          echo "npm_audit_ids=$(python scripts/security_baseline.py npm-audit-ids --file .security/security_baseline.json)" >> "$GITHUB_OUTPUT"

      - uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-root

      - name: SAST (Bandit)
        working-directory: backend
        run: |
          poetry run pip install bandit
          BANDIT_FLAGS="-r app -ll -iii"
          if [ -n "${{ steps.baseline.outputs.bandit_ids }}" ]; then
            BANDIT_FLAGS="$BANDIT_FLAGS -s ${{ steps.baseline.outputs.bandit_ids }}"
          fi
          poetry run bandit $BANDIT_FLAGS

      - name: SCA (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit
          IGNORE_ARGS=""
          for vuln in ${{ steps.baseline.outputs.pip_audit_ids }}; do
            IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $vuln"
          done
          pip-audit --local $IGNORE_ARGS

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: SCA (npm audit critical)
        working-directory: frontend
        run: |
          NPM_AUDIT_ARGS=(--audit-level=critical)
          if [ -n "${{ steps.baseline.outputs.npm_audit_ids }}" ]; then
            for vuln in ${{ steps.baseline.outputs.npm_audit_ids }}; do
              NPM_AUDIT_ARGS+=(--ignore-vuln "$vuln")
            done
          fi
          npm audit "${NPM_AUDIT_ARGS[@]}"

  backend:
    name: Backend (lint + typecheck + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: poetry run ruff check app tests

      - name: Typecheck
        run: poetry run mypy app --ignore-missing-imports

      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-at-least-32-chars
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DB: default
          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2kteA==
        run: poetry run pytest tests/ -v --tb=short

      - name: Perf Smoke (ledger detailed costs)
        run: poetry run python scripts/benchmark_ledger_costs.py --dry-run --requests 120 --warmup 15 --output-json benchmark_artifacts/ledger_costs_benchmark.json

      - name: Release Smoke (hardening)
        run: poetry run python scripts/release_smoke.py --dry-run --output-json benchmark_artifacts/release_smoke.json

      - name: Go/No-Go Gate (hardening)
        run: poetry run python scripts/go_no_go_gate.py --smoke-json benchmark_artifacts/release_smoke.json --perf-json benchmark_artifacts/ledger_costs_benchmark.json --output-json benchmark_artifacts/go_no_go.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-benchmark-artifacts
          path: backend/benchmark_artifacts/*.json

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: SP-A02 Gate (no auth token storage)
        run: npm run check:auth-token-storage
