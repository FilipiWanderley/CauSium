name: Build and deploy Python app to Azure Web App - causium-api-2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies into virtual environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          python -m venv antenv
          source antenv/bin/activate
          poetry install --no-interaction --no-root --only=main
          pip install gunicorn

      - name: Create deployment package
        working-directory: backend
        run: |
          zip -r ../deploy.zip . \
            -x ".venv/*" \
            -x "__pycache__/*" \
            -x ".pytest_cache/*" \
            -x "tests/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'causium-api-2026'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_900224B33F554AEEBBDAE3170E557EE3 }}
          package: deploy.zip
