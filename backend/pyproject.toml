[tool.poetry]
name = "stratopulse-backend"
version = "0.1.0"
description = "StratoPulse FinOps Platform Backend"
authors = ["StratoPulse Team <dev@stratopulse.io>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.115.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
sqlalchemy = {version = "^2.0.0", extras = ["asyncio"]}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pydantic = {version = "^2.8.0", extras = ["email"]}
pydantic-settings = "^2.4.0"
redis = {version = "^5.0.0", extras = ["hiredis"]}
celery = {version = "^5.4.0", optional = true}
apscheduler = "^3.10.0"
azure-identity = "^1.17.0"
azure-mgmt-costmanagement = "^4.0.0"
azure-mgmt-monitor = "^6.0.0"
azure-mgmt-resource = "^23.0.0"
azure-mgmt-subscription = "^3.1.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
cryptography = "^43.0.0"
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
bcrypt = "^4.2.0"
python-multipart = "^0.0.9"
clickhouse-driver = "^0.2.9"
clickhouse-connect = "^0.7.0"
structlog = "^24.4.0"
httpx = "^0.27.0"
tenacity = "^9.0.0"
faker = "^26.0.0"
eval-type-backport = "^0.3.1"

[tool.poetry.extras]
celery = ["celery"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
pytest-httpx = "^0.30.0"
factory-boy = "^3.3.0"
faker = "^26.0.0"
mypy = "^1.11.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
