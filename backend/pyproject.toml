[tool.poetry]
name = "causium-backend"
version = "0.1.0"
description = "CauSium FinOps Platform Backend"
authors = ["CauSium Team <dev@causium.io>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.115.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
gunicorn = "^22.0.0"
sqlalchemy = {version = "^2.0.0", extras = ["asyncio"]}
asyncpg = "^0.29.0"
aiosqlite = "^0.20.0"
alembic = "^1.13.0"
pydantic = {version = "^2.8.0", extras = ["email"]}
pydantic-settings = "^2.4.0"
redis = {version = "^5.0.0", extras = ["hiredis"]}
celery = {version = "^5.4.0", optional = true}
apscheduler = "^3.10.0"
azure-identity = "^1.17.0"
azure-mgmt-costmanagement = "^4.0.0"
azure-mgmt-monitor = "^6.0.0"
azure-mgmt-resource = "^23.0.0"
azure-mgmt-subscription = "^3.1.0"
azure-storage-blob = "^12.22.0"
azure-mgmt-advisor = "^9.0.0"
azure-mgmt-resourcegraph = "^8.0.0"
boto3 = "^1.35.0"
google-auth = "^2.36.0"
google-cloud-bigquery = "^3.28.0"
google-cloud-logging = "^3.11.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
cryptography = "^43.0.0"
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
bcrypt = "^4.2.0"
python-multipart = "^0.0.9"
clickhouse-driver = "^0.2.9"
clickhouse-connect = "^0.7.0"
structlog = "^24.4.0"
httpx = "^0.27.0"
aiohttp = "^3.10.11"
opentelemetry-sdk = ">=1.20.0,<2.0"
opentelemetry-exporter-otlp-proto-grpc = ">=1.20.0,<2.0"
opentelemetry-propagator-b3 = ">=1.20.0,<2.0"
opentelemetry-instrumentation-fastapi = { version = ">=0.41b0", allow-prereleases = true }
opentelemetry-instrumentation-sqlalchemy = { version = ">=0.41b0", allow-prereleases = true }
opentelemetry-instrumentation-redis = { version = ">=0.41b0", allow-prereleases = true }
opentelemetry-instrumentation-httpx = { version = ">=0.41b0", allow-prereleases = true }
tenacity = "^9.0.0"
eval-type-backport = "^0.3.1"

[tool.poetry.extras]
celery = ["celery"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
pytest-httpx = "^0.30.0"
factory-boy = "^3.3.0"
faker = "^26.0.0"
mypy = "^1.11.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "app.core.logging",
    "app.core.observability",
    "app.core.dependencies",
    "app.domains.admin.router",
    "app.domains.admin.service",
    "app.domains.audit_chain.router",
    "app.domains.auth.router",
    "app.domains.auth.service",
    "app.domains.change_events.router",
    "app.domains.cloud_accounts.router",
    "app.domains.cloud_accounts.service",
    "app.domains.cloud_ledger.service",
    "app.domains.connectors.aws.client",
    "app.domains.connectors.azure.client",
    "app.domains.connectors.gcp.client",
    "app.domains.decision_engine.aks_nodepool_rightsizing_engine",
    "app.domains.decision_engine.optimization_plan_service",
    "app.domains.decision_engine.performance_context_builder",
    "app.domains.decision_engine.resource_context_builder",
    "app.domains.decision_engine.router",
    "app.domains.decision_engine.savings_evidence_builder",
    "app.domains.decision_engine.service",
    "app.domains.decision_engine.vm_rightsizing_engine",
    "app.domains.economics.export_runtime",
    "app.domains.economics.router",
    "app.domains.executive.service",
    "app.domains.experiments.router",
    "app.domains.experiments.service",
    "app.domains.gov.router",
    "app.domains.green.router",
    "app.domains.intel.cost_explanation_service",
    "app.domains.intel.execution_plan_service",
    "app.domains.intel.router",
    "app.domains.intel.usage_observation_service",
    "app.domains.invites.router",
    "app.domains.notifications.router",
    "app.domains.notifications.service",
    "app.domains.risk_budgets.router",
    "app.domains.workflow.router",
    "app.main",
    "app.workers.carbon_sync_worker",
    "app.workers.export_worker",
    "app.workers.ingestion_worker",
    "app.workers.maintenance_worker",
    "app.workers.notification_worker",
    "app.workers.scoring_worker",
]
ignore_errors = true
