global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: causium_backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 15s
    # In production, set INTERNAL_MONITORING_KEY in .env and uncomment:
    # headers:
    #   X-Internal-Key: "${INTERNAL_MONITORING_KEY}"
    # In dev/local, the /metrics endpoint is open (no key required).
